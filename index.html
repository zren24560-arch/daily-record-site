<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>共享问题记录</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>共享问题记录</h1>
      <p>所有访问者共享同一份数据，像一个轻量云笔记</p>
    </header>

    <section class="panel form-panel">
      <h2>新增记录</h2>
      <form id="recordForm">
        <div class="form-group">
          <label for="title">问题标题</label>
          <input type="text" id="title" placeholder="例如：接口返回 500 错误" required />
        </div>

        <div class="form-group">
          <label for="description">问题描述</label>
          <textarea id="description" placeholder="请输入问题描述" required></textarea>
        </div>

        <div class="form-group">
          <label for="solution">解决方案</label>
          <textarea id="solution" placeholder="请输入解决方案"></textarea>
        </div>

        <button type="submit" class="btn">保存记录</button>
      </form>
    </section>

    <section class="panel list-panel">
      <div class="list-header">
        <h2>记录列表</h2>
        <button id="refreshBtn" class="btn secondary">刷新</button>
      </div>
      <div id="loading" class="loading">正在加载数据...</div>
      <div id="recordList" class="record-list"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./script.js"></script>
</body>
</html>
